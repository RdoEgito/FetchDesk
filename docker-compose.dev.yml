services:
  database:
    image: postgres:16-alpine
    container_name: fetchdesk_db_dev
    environment:
      POSTGRES_DB: order_management_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d order_management_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fetchdesk_rabbitmq_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: node:22-alpine
    working_dir: /app
    environment:
      DATABASE_URL: postgres://admin:adminpassword@database:5432/order_management_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./FetchDesk.Nest:/app
      - /app/node_modules
    ports:
      - "5000:8080"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./FetchDesk.Client.React:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data_dev:
