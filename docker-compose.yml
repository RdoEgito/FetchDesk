services:
  database:
    image: postgres:16-alpine
    container_name: fetchdesk_db
    environment:
      POSTGRES_DB: order_management_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d order_management_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fetchdesk_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: FetchDesk.Nest/Dockerfile
    environment:
      - DATABASE_URL=postgres://admin:adminpassword@database:5432/order_management_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5000:8080"

  frontend:
    build:
      context: .
      dockerfile: FetchDesk.Client.React/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data: